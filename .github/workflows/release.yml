# Release: publish packages to GitHub Packages with build provenance, then move
# the floating major tag (v1) so consumers on `@v1` pick up the release.
# Consumers that pin `@<sha>` (recommended) get it through Dependabot PRs.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release # protected environment: requires approval from @namankalola
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@namankalola'
      - run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test && pnpm lint --max-warnings 0
      - name: Check tag matches package versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          for pkg in packages/*/package.json; do
            [ "$(jq -r .version "$pkg")" = "$version" ] || { echo "::error file=$pkg::version is not $version"; exit 1; }
          done
      - name: Pack
        run: mkdir -p dist && pnpm -r pack --pack-destination "$PWD/dist"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tgz
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm -r publish --no-git-checks
      - name: Release notes and floating major tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tgz --generate-notes --verify-tag
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_REF_NAME" && git push -f origin "refs/tags/$major"
