# Reusable container pipeline: lint -> build -> scan -> (push -> sign -> attest).
#
# Critical image vulnerabilities always block (floor); the team threshold in
# security.container.failOn can only add severities on top of that.
name: container

on:
  workflow_call:
    inputs:
      guardrails-ref:
        type: string
        default: v1
      image-name:
        description: Image reference without tag. Default ghcr.io/<owner>/<repo>
        type: string
        default: ''
      push:
        description: Push, sign and attest the image (use on the default branch only)
        type: boolean
        default: false
    secrets:
      guardrails-token:
        required: false

permissions: {}

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.policy.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ariseqa/qa-guardrails
          ref: ${{ inputs.guardrails-ref }}
          token: ${{ secrets.guardrails-token || github.token }}
          path: .guardrails
          persist-credentials: false
      - id: tools
        uses: ./.guardrails/.github/actions/setup-guardrails
      - id: policy
        run: |
          enabled=$(${{ steps.tools.outputs.cli }} validate | jq -r .security.container.enabled)
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          [ "$enabled" = "true" ] || echo "::notice::Container pipeline disabled in guardrails.config.yml (security.container.enabled) - skipping"

  image:
    name: image
    needs: policy
    if: needs.policy.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ariseqa/qa-guardrails
          ref: ${{ inputs.guardrails-ref }}
          token: ${{ secrets.guardrails-token || github.token }}
          path: .guardrails
          persist-credentials: false
      - id: tools
        uses: ./.guardrails/.github/actions/setup-guardrails
      - id: policy
        run: |
          policy=$(${{ steps.tools.outputs.cli }} validate | jq -c .)
          {
            echo "dockerfile=$(jq -r .security.container.dockerfile <<<"$policy")"
            echo "context=$(jq -r .security.container.context <<<"$policy")"
            case "$(jq -r .security.container.failOn <<<"$policy")" in
              critical) echo "severity=CRITICAL" ;;
              high)     echo "severity=HIGH,CRITICAL" ;;
              medium)   echo "severity=MEDIUM,HIGH,CRITICAL" ;;
            esac
            echo "provenance=$(jq -r .supplyChain.provenance <<<"$policy")"
          } >> "$GITHUB_OUTPUT"
      - id: image
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          REPO: ${{ github.repository }}
        run: echo "name=$(echo "${IMAGE_NAME:-ghcr.io/$REPO}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Hadolint
        env:
          DOCKERFILE: ${{ steps.policy.outputs.dockerfile }}
        run: |
          docker run --rm -i -v "$PWD/.guardrails/security/hadolint.yaml:/.config/hadolint.yaml:ro" \
            hadolint/hadolint:v2.15.1 hadolint --config /.config/hadolint.yaml - < "$DOCKERFILE"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.policy.outputs.context }}
          file: ${{ steps.policy.outputs.dockerfile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          push: false
          provenance: false

      - name: Trivy image scan
        env:
          SEVERITY: ${{ steps.policy.outputs.severity }}
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" aquasec/trivy:0.76.1 \
            image --exit-code 1 --severity "$SEVERITY" --ignore-unfixed --format table "$IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" aquasec/trivy:0.76.1 \
            image --format cyclonedx --output /out/image-sbom.cdx.json "$IMAGE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom
          path: image-sbom.cdx.json
          retention-days: 30

      - if: inputs.push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        if: inputs.push
        name: Push scanned image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          while read -r tag; do [ -n "$tag" ] && docker push "$tag"; done <<<"$TAGS"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - if: inputs.push
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign (keyless, Sigstore)
        if: inputs.push
        env:
          REF: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"
      - name: Build provenance attestation
        if: inputs.push && steps.policy.outputs.provenance == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
