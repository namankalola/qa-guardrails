version: 2
updates:
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      lint-tooling: { patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'globals', 'prettier'] }
      runtime: { patterns: ['yaml', 'zod'] }
  - package-ecosystem: docker
    directory: /docker/playwright-runner
    schedule: { interval: weekly }
