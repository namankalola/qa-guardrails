# Nightly: full regression, the quarantine suite (to prove fixes before release
# from quarantine), DAST against an authorised test environment, and the
# runner image pipeline. None of these block PRs.
name: nightly

on:
  schedule:
    - cron: '0 2 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantine-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      GUARDRAILS_QUARANTINE: only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Run quarantined tests only (informational)
        run: npx playwright test --pass-with-no-tests || echo "::warning::quarantined tests still failing"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: quarantine-reports
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  dast:
    # Enable security.dast in guardrails.config.yml first, with authorizedHosts.
    uses: acme-org/acme-qa-guardrails/.github/workflows/dast.yml@v1
    with:
      guardrails-ref: v1

  runner-image:
    # Enable security.container in guardrails.config.yml first.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: acme-org/acme-qa-guardrails/.github/workflows/container.yml@v1
    with:
      guardrails-ref: v1
      push: ${{ github.ref == 'refs/heads/main' }}
