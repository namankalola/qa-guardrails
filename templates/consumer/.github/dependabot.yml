version: 2
registries:
  acme-github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.DEPENDABOT_PACKAGES_TOKEN }}
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /
    registries: [acme-github-packages]
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      acme-guardrails: { patterns: ['@acme/*'] }
      playwright: { patterns: ['@playwright/*', 'allure-*'] }
      lint-tooling:
        {
          patterns: ['eslint*', 'typescript-eslint', 'prettier', 'typescript', '@commitlint/*', 'husky', 'lint-staged'],
        }
